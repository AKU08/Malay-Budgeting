<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dompet — Budget Tracker</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1B1B2F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EEF1F7;
    --ink: #1B1B2F;
    --ink-soft: #6B7080;
    --card: #FFFFFF;
    --myr: #2DD4BF;
    --myr-soft: #E3FBF7;
    --idr: #FB7185;
    --idr-soft: #FFE9EC;
    --accent: #6366F1;
    --line: #E2E5EE;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    padding-bottom: 48px;
    min-height: 100vh;
  }
  .display { font-family: 'Space Grotesk', sans-serif; }
  header { padding: 28px 20px 20px; }
  .greeting { font-size: 14px; color: var(--ink-soft); margin: 0 0 4px; }
  .hero-amount { font-size: 44px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; margin: 0; }
  .hero-sub { font-size: 13px; color: var(--ink-soft); margin-top: 6px; }
  .tabs { display: flex; gap: 8px; padding: 0 20px 20px; }
  .tab { font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 500; padding: 8px 14px; border-radius: 100px; border: 1px solid var(--line); background: var(--card); color: var(--ink-soft); cursor: pointer; }
  .tab.active { background: var(--ink); color: white; border-color: var(--ink); }
  section { padding: 0 20px; margin-bottom: 28px; }
  .section-label { font-size: 13px; font-weight: 600; color: var(--ink-soft); margin: 0 0 12px; }
  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .bar-cat { width: 84px; font-size: 12.5px; color: var(--ink-soft); flex-shrink: 0; }
  .bar-track { flex: 1; height: 8px; background: var(--line); border-radius: 6px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 6px; background: var(--accent); }
  .bar-amount { font-size: 12.5px; font-weight: 600; width: 64px; text-align: right; flex-shrink: 0; }
  .feed-day { font-size: 12px; font-weight: 600; color: var(--ink-soft); margin: 20px 0 10px; }
  .bubble { background: var(--card); border-radius: 16px 16px 16px 4px; padding: 12px 14px; margin-bottom: 8px; max-width: 88%; box-shadow: 0 1px 2px rgba(27,27,47,0.04); }
  .bubble-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .bubble-note { font-size: 14.5px; font-weight: 500; }
  .bubble-amount { font-size: 14.5px; font-weight: 700; white-space: nowrap; }
  .bubble-meta { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
  .tag { font-size: 11px; padding: 2px 8px; border-radius: 100px; font-weight: 500; }
  .tag.myr { background: var(--myr-soft); color: #0D9488; }
  .tag.idr { background: var(--idr-soft); color: #E11D48; }
  .bubble-time { font-size: 11px; color: var(--ink-soft); }
  .empty { text-align: center; padding: 60px 20px; color: var(--ink-soft); }
  .empty .display { font-size: 20px; color: var(--ink); margin-bottom: 6px; }
  .setup-card { background: var(--card); border: 1px dashed var(--line); border-radius: 16px; padding: 18px; margin: 20px; font-size: 13.5px; line-height: 1.6; color: var(--ink-soft); }
  .setup-card code { background: var(--line); padding: 1px 6px; border-radius: 4px; font-size: 12px; }
</style>
</head>
<body>

<header>
  <p class="greeting" id="greeting">Bulan ini</p>
  <p class="hero-amount display" id="hero-amount">RM 0.00</p>
  <p class="hero-sub" id="hero-sub">belum ada transaksi</p>
</header>

<div class="tabs">
  <div class="tab active" data-range="month">Bulan ini</div>
  <div class="tab" data-range="week">7 hari</div>
  <div class="tab" data-range="all">Semua</div>
</div>

<section id="category-section" style="display:none;">
  <p class="section-label">Kategori</p>
  <div id="category-bars"></div>
</section>

<section>
  <p class="section-label">Riwayat</p>
  <div id="feed"></div>
</section>

<div id="config-warning"></div>

<script>
  // ================================================================
  // FILL THIS IN: your deployed Google Apps Script Web App URL
  // ================================================================
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwwP31grc6_ZLmPtp6XWX3CovEwksAHs4hbu54olHLzwW9UL95-D0s--iURsrEzBfJ6jg/exec';

  let allTransactions = [];
  let currentRange = 'month';

  async function loadData() {
    if (APPS_SCRIPT_URL.includes('PASTE_YOUR')) {
      document.getElementById('config-warning').innerHTML = `
        <div class="setup-card">
          <strong>Belum connect ke backend.</strong><br>
          Buka <code>index.html</code>, cari <code>APPS_SCRIPT_URL</code>, ganti dengan URL Web App
          dari Google Apps Script lo. Lihat README.md buat cara deploy-nya.
        </div>`;
      return;
    }
    try {
      const res = await fetch(APPS_SCRIPT_URL);
      const json = await res.json();
      allTransactions = json.transactions || [];
      render();
    } catch (err) {
      document.getElementById('feed').innerHTML = '<div class="empty">Gagal ambil data. Cek APPS_SCRIPT_URL lo.</div>';
    }
  }

  function filterByRange(txs, range) {
    const now = new Date();
    return txs.filter(t => {
      const d = new Date(t.timestamp);
      if (range === 'week') {
        return (now - d) / (1000 * 60 * 60 * 24) <= 7;
      }
      if (range === 'month') {
        return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
      }
      return true;
    });
  }

  function render() {
    const txs = filterByRange(allTransactions, currentRange);
    const total = txs.reduce((sum, t) => sum + Number(t.amountBase), 0);

    document.getElementById('hero-amount').textContent = 'RM ' + total.toFixed(2);
    document.getElementById('hero-sub').textContent = txs.length + ' transaksi';

    renderCategories(txs);
    renderFeed(txs);
  }

  function renderCategories(txs) {
    const section = document.getElementById('category-section');
    const container = document.getElementById('category-bars');
    if (txs.length === 0) { section.style.display = 'none'; return; }

    const byCat = {};
    txs.forEach(t => { byCat[t.category] = (byCat[t.category] || 0) + Number(t.amountBase); });
    const sorted = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
    const max = sorted[0][1];

    container.innerHTML = sorted.map(([cat, amt]) => `
      <div class="bar-row">
        <div class="bar-cat">${cat}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${(amt / max * 100).toFixed(0)}%"></div></div>
        <div class="bar-amount">RM${amt.toFixed(0)}</div>
      </div>
    `).join('');
    section.style.display = 'block';
  }

  function renderFeed(txs) {
    const feed = document.getElementById('feed');
    if (txs.length === 0) {
      feed.innerHTML = `<div class="empty">
        <div class="display">Belum ada catatan</div>
        Kirim expense ke bot Telegram lo buat mulai nyatet.
      </div>`;
      return;
    }

    let html = '';
    let lastDay = '';
    txs.forEach(t => {
      const d = new Date(t.timestamp);
      const dayLabel = d.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'short' });
      if (dayLabel !== lastDay) {
        html += `<div class="feed-day">${dayLabel}</div>`;
        lastDay = dayLabel;
      }
      const time = d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
      const tagClass = t.currency === 'MYR' ? 'myr' : 'idr';
      html += `
        <div class="bubble">
          <div class="bubble-top">
            <div class="bubble-note">${t.note}</div>
            <div class="bubble-amount">${t.currency} ${Number(t.amount).toLocaleString('id-ID')}</div>
          </div>
          <div class="bubble-meta">
            <span class="tag ${tagClass}">${t.category}</span>
            <span class="bubble-time">${time} · RM${Number(t.amountBase).toFixed(2)}</span>
          </div>
        </div>`;
    });
    feed.innerHTML = html;
  }

  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentRange = tab.dataset.range;
      render();
    });
  });

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }

  loadData();
  setInterval(loadData, 300000); // refresh every 5 min (keeps server load low)
</script>
</body>
</html>
